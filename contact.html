<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact the student using the validated contact form">
  <title>Contact | Student Portfolio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">MyPortfolio</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
      <nav aria-label="Main navigation">
        <ul class="nav-menu" id="navMenu">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Me</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="planner.html">Academic Planner</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
 
  <main>
    <section class="page-banner">
      <div class="container">
        <h1>Contact Me</h1>
        <p>Have a question or want to collaborate? Send me a message.</p>
      </div>
    </section>
 
    <section class="section">
      <div class="container narrow">
        <div class="card">
          <form id="contactForm" novalidate>
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" placeholder="Your full name">
              <span class="error" id="nameError"></span>
            </div>
 
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="you@example.com">
              <span class="error" id="emailError"></span>
            </div>
 
            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="text" id="phone" name="phone" placeholder="08012345678" inputmode="numeric">
              <span class="error" id="phoneError"></span>
            </div>
 
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" placeholder="Type your message here..."></textarea>
              <span class="error" id="messageError"></span>
            </div>
 
            <button type="submit" class="btn btn-primary">Send Message</button>
            <p class="success" id="formSuccess" role="status"></p>
          </form>
        </div>
      </div>
    </section>
  </main>
 
  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year">2025</span> Your Full Name. All rights reserved.</p>
    </div>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
